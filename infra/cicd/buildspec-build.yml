version: 0.2
env:
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"
phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm install -g pulumi@3.228.0 bun
      # Workspace install at root hoists deps for apps/web-ui, apps/workers, infra/*
      - bun install --frozen-lockfile
      - cd infra/networking && bun install && pulumi install && cd ../..
      - cd infra/compute && bun install && pulumi install && cd ../..
  build:
    commands:
      # Nx task graph: build + test across all projects (web-ui, workers)
      - bun run build
      - bun run test
artifacts:
  files: '**/*'
  name: build-output-$(date +%Y%m%d-%H%M%S)