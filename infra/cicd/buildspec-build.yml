version: 0.2
env:
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"
phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm install -g pulumi@3.228.0 bun
      # Workspace install at root hoists deps for apps/web-ui, apps/workers, infra/*
      - bun install --frozen-lockfile
      - cd infra/networking && bun install && pulumi install && cd ../..
      - cd infra/compute && bun install && pulumi install && cd ../..
  build:
    commands:
      # Layer 1 coverage gate: every HTTP handler must declare the permission it
      # requires (`export const authz`) or hold a justified allowlist entry, and
      # the committed route manifest must be current.
      #
      # ENFORCING as of Workstream D: all 215 handlers are accounted for
      # (15 allowlisted + 103 declared + 97 inferred), so an undeclared endpoint
      # now fails the build. That is the whole point of default-deny — coverage
      # stops being a discipline problem and becomes a compile error.
      - bun run rbac:check
      # Nx task graph: build + test across all projects (web-ui, workers)
      - bun run build
      # No Postgres sidecar in this pipeline — the real-DB integration suites
      # are describe.skipIf'd without DATABASE_URL, same as `bun run test`.
      - bun run test:coverage
artifacts:
  files: '**/*'
  name: build-output-$(date +%Y%m%d-%H%M%S)