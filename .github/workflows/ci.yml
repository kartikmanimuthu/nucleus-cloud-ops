name: CI

on:
  push:
    branches: [master-v1]
  pull_request:
    branches: [master-v1]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.12

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `bun install` runs the `prepare` hook, which generates the Prisma clients.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production

      # Non-blocking for now: `web-ui` carries pre-existing
      # @typescript-eslint/no-explicit-any errors. Remove continue-on-error
      # once those are cleared so lint becomes a required check.
      - name: Lint
        run: bun run lint
        continue-on-error: true

      # Non-blocking until the mock-harness failures in the agent test suite
      # are fixed. Remove continue-on-error once the suite is green.
      - name: Test
        run: bun run test
        continue-on-error: true
