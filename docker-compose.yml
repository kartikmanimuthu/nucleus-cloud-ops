version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nucleus-postgres
    environment:
      POSTGRES_DB: nucleus
      POSTGRES_USER: nucleus
      POSTGRES_PASSWORD: nucleus_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nucleus -d nucleus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
